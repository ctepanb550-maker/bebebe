<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<style>
:root{--bg:#fff1f2;--hint:#9f4a52;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
prefers-color-scheme:dark{:root:not([data-theme="light"]){--bg:#14070a;--hint:#c98a90;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14070a;--hint:#c98a90;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
canvas{flex:1;width:100%;min-height:0;display:block}
.hint{margin:0 0 14px;font-size:14px;color:var(--hint);letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="hint">Для тебя · нажми, чтобы рассыпать</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 56, H = 26;
const phrases = ["не грусти", "всё будет хорошо", "улыбайся", "ты справишься", "я в тебя верю", "ты молодец", "все ты сможещь солнышко", "ты ооочень сильная","моську попрще следая :)", "А АВАНС ГДЕ?",];
let ps = [], cw, chh, ox, oy, st = 'appear', stT = 0, last = performance.now();

function build() {
  const text = phrases.join("  ") + "  ";
  let idx = 0; ps = [];
  for (let cy = 0; cy < H; cy++) for (let cx = 0; cx < W; cx++) {
    const x = (cx - W / 2) / (W / 2) * 1.4, y = (H / 2 - cy) / (H / 2) * 1.3 + 0.15;
    const a = x * x + y * y - 1;
    if (a * a * a - x * x * y * y * y <= 0) {
      const c = text[idx++ % text.length];
      if (c === ' ') continue;
      ps.push({ c, x: cx, y: cy, s: Math.random() * 1.8, a: 0.7 + Math.random() * 0.3, f: 0, d: 0, vx: 0, vy: 0 });
    }
  }
}
function resize() {
  const d = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  cw = Math.min(w * 0.94 / W, h * 0.92 / (H * 2)); chh = cw * 2;
  ox = (w - W * cw) / 2; oy = (h - H * chh) / 2;
}
function crumble() {
  if (st === 'fall' || st === 'pause') return;
  st = 'fall'; stT = 0;
  ps.forEach(p => { p.d = Math.random() * 2.2; p.vx = (Math.random() - 0.5) * 10; p.vy = 0; p.f = 0; });
}
function pulse(t) {
  const ph = (t * 1.1) % 1, g = (m) => Math.exp(-Math.pow((ph - m) / 0.06, 2));
  return g(0.1) + 0.7 * g(0.32);
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; stT += dt;
  if (st === 'appear' && stT > 2.2) { st = 'beat'; stT = 0; }
  else if (st === 'beat' && stT > 5) crumble();
  else if (st === 'fall') {
    ps.forEach(p => {
      if (!p.f && stT >= p.d) p.f = 1;
      if (p.f) { p.vy += 32 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    });
    ps = ps.filter(p => p.y < H + 1);
    if (!ps.length) { st = 'pause'; stT = 0; }
  } else if (st === 'pause' && stT > 1) { build(); st = 'appear'; stT = 0; }

  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.font = (cw * 1.7) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const f = st === 'beat' ? pulse(stT) : 0, s = 1 + 0.07 * f;
  ctx.save();
  ctx.translate(w / 2, oy + H * chh * 0.5); ctx.scale(s, s); ctx.translate(-w / 2, -(oy + H * chh * 0.5));
  for (const p of ps) {
    if (st === 'appear' && stT < p.s) continue;
    ctx.globalAlpha = p.f ? p.a * 0.8 : Math.min(1, p.a * (0.82 + 0.3 * f));
    ctx.fillStyle = p.f ? '#b3141c' : '#ff2a1a';
    ctx.fillText(p.c, ox + (p.x + 0.5) * cw, oy + (p.y + 0.5) * chh);
  }
  ctx.restore(); ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', crumble);
window.addEventListener('resize', resize);
build(); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
